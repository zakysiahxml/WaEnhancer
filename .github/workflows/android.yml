# Build debug APK saat push — untuk fork WaEnhancer (Ajen).
# v2: tanpa android-actions/setup-android (gagal di run #1) — pakai SDK
# bawaan runner ubuntu-latest + sdkmanager untuk paket yang kurang.
# Build memakai JDK 21 mengikuti CI upstream (build-whatsapp.yml):
# project menarget Java 17, tapi AGP 9.3 mencatat lint bisa crash di JDK 17
# dan CI upstream sendiri memakai Temurin 21.
name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Install SDK packages (platform 37, build-tools, NDK 28.2, CMake 3.22.1)
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (semua flavor)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
