# Build debug APK saat push — untuk fork WaEnhancer (Ajen).
# v4: TANPA langkah install SDK — meniru persis CI upstream
# (build-whatsapp.yml): checkout -> JDK 21 -> chmod -> gradlew.
# Upstream membuktikan SDK bawaan runner ubuntu-latest sudah cukup;
# langkah sdkmanager-ku yang gagal terus (run #2 exit 127, run #3
# gagal lagi di step yang sama) ternyata tidak dibutuhkan.
# Build memakai JDK 21 mengikuti CI upstream (build-whatsapp.yml):
# project menarget Java 17, tapi AGP 9.3 mencatat lint bisa crash di JDK 17
# dan CI upstream sendiri memakai Temurin 21.
name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (semua flavor)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
